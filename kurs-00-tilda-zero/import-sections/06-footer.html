:root{color-scheme:light;scroll-behavior:smooth}
body{margin:0;background:#092b40;color:#092b40;font-family:"PT Sans Narrow","Arial Narrow",sans-serif}
.hg-page{--hg-navy:#092b40;--hg-blue:#04aee3;--hg-paper:#f4f0e8;overflow:hidden}
.hg-page *{box-sizing:border-box}
.hg-page img{display:block;max-width:100%;height:auto}
.hg-page a{color:inherit}
.hg-page h1,.hg-page h2,.hg-page h3,.hg-page p{margin:0}
.hg-page button,.hg-page input{font-family:inherit}
.hg-page a:focus-visible,.hg-page button:focus-visible,.hg-page input:focus-visible{outline:3px solid #ef9c35;outline-offset:5px}
.hg-frame{width:calc(100% - 48px);max-width:1392px;margin:0 auto}
.hg-eyebrow{display:block;font-size:16px;line-height:1.35;letter-spacing:.15em;text-transform:uppercase}
.hg-display{font-family:Fuel,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:-.035em}
.hg-title{font-size:clamp(64px,7.5vw,112px);line-height:1.03;margin-top:24px!important;margin-bottom:32px!important}
.hg-copy{font-size:26px;line-height:1.35}
.hg-button{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:15px 24px;border:1px solid #092b40;background:#092b40;color:#fff!important;font-weight:700;font-size:18px;line-height:1.1;letter-spacing:.06em;text-decoration:none;text-transform:uppercase;cursor:pointer}
.hg-section{padding:96px 0}
.hg-hero{position:relative;isolation:isolate;min-height:710px;background:#b9e6f7}
.hg-hero-bg{position:absolute;inset:0;width:100%;height:100%!important;object-fit:cover;object-position:center;z-index:-2}
.hg-hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,#c0eaffdd 0%,#bde7fa80 30%,transparent 58%);z-index:-1}
.hg-topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:80px;position:relative;z-index:3}
.hg-brand{font-family:Fuel,sans-serif;font-size:30px;font-weight:700;text-decoration:none!important}
.hg-nav{display:flex;gap:28px;font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.hg-nav a{text-decoration:none}.hg-nav a:hover{text-decoration:underline}
