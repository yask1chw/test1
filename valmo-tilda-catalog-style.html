    if(cls&&!g.classList.contains(cls))g.classList.add(cls);
    if(cls==='vcs-filter-type')typeSelect(g);

    var val=field&&field.value;
    g.querySelectorAll('.js-catalog-filter-custom-select').forEach(function(option){var active=Boolean(val)&&val===option.dataset.selectVal;if(option.classList.contains('vcs-is-active')!==active)option.classList.toggle('vcs-is-active',active);});
   });
   var brand=sidebar.querySelector('.vcs-filter-brand');
   if(brand){var names=Array.from(brand.querySelectorAll('[data-select-val]')).map(function(n){return normalize(n.dataset.selectVal);}),parts=Array.from(sidebar.querySelectorAll('.t-catalog__parts-item-title')).map(function(n){return normalize(n.textContent);}).filter(function(n){return n!=='все';});
    var current=sidebar.querySelector('.t-catalog__parts-current[data-storepart-uid]');var hide=Boolean(parts.length)&&parts.every(function(p){return names.indexOf(p)!==-1;})&&(!current||!current.dataset.storepartUid);if(sidebar.classList.contains('vcs-brands-only')!==hide)sidebar.classList.toggle('vcs-brands-only',hide);
   }
   if(!sidebar.querySelector('.vcs-reset')&&root.querySelector('.js-catalog-filter-reset')){var reset=node('button','vcs-reset','↻ Сбросить фильтры');reset.type='button';sidebar.append(reset);}
  }
  function typeSelect(group){
   var boxes=Array.from(group.querySelectorAll('input.js-catalog-filter-opt-chb'));if(!boxes.length)return;
   var select=group.querySelector('select.vcs-type-select');
   if(!select){
    select=node('select','vcs-type-select');select.dataset.vcsOwner=CONFIG.recordId;select.setAttribute('aria-label','Тип техники');
    var wrap=group.querySelector('.js-catalog-filter-item-controls-wr');
    if(wrap){wrap.classList.add('vcs-native-types');wrap.setAttribute('aria-hidden','true');group.insertBefore(select,wrap);}else group.append(select);
   }
   var signature=JSON.stringify(boxes.map(function(box){return [box.dataset.filterValue||box.name,box.disabled];}));
   if(select.dataset.vcsOptions!==signature){
    select.replaceChildren();var all=node('option','','Все типы');all.value='';select.append(all);
    boxes.forEach(function(box){var option=node('option','',box.dataset.filterValue||box.name);option.value=box.dataset.filterValue||box.name;option.disabled=box.disabled;select.append(option);box.tabIndex=-1;});select.dataset.vcsOptions=signature;
   }
   var checked=boxes.filter(function(box){return box.checked;});
   var multiple=select.querySelector('[data-vcs-multiple]');
   if(checked.length>1){if(!multiple){multiple=node('option','','Выбрано типов: '+checked.length);multiple.value='__multiple__';multiple.disabled=true;multiple.dataset.vcsMultiple='1';select.append(multiple);}select.value='__multiple__';}
   else{if(multiple)multiple.remove();select.value=checked.length?(checked[0].dataset.filterValue||checked[0].name):'';}
  }
  function applyQuery(){
   if(!CONFIG.applyMenuQuery)return;
   var params=new URLSearchParams(location.search),brand=params.get('brand'),q=params.get('q');
   if(brand&&!brandApplied){var group=root.querySelector('.vcs-filter-brand'),match=group&&Array.from(group.querySelectorAll('[data-select-val]')).find(function(n){return normalize(n.dataset.selectVal)===normalize(brand);});if(match){brandApplied=true;match.click();}}
   if(q&&!queryApplied){var input=root.querySelector('input[type="search"],input.js-catalog-filter-search,input[name="search"]');if(input){queryApplied=true;input.value=q;input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new KeyboardEvent('keyup',{key:'Enter',bubbles:true}));}}
  }
  function refresh(){filters();root.querySelectorAll('.js-catalog-grid-cont .t-catalog__card').forEach(decorate);applyQuery();}
  root.addEventListener('click',function(e){
   var button=e.target.closest('.js-catalog-filter-mob-btn');
   if(button&&window.matchMedia('(max-width:1023px)').matches){
    e.preventDefault();e.stopImmediatePropagation();var open=!root.classList.contains('vcs-mobile-open');root.classList.toggle('vcs-mobile-open',open);button.setAttribute('aria-expanded',String(open));
   }
  },true);
  root.addEventListener('keydown',function(e){var button=e.target.closest('.js-catalog-filter-mob-btn');if(button&&['Enter',' '].includes(e.key)){e.preventDefault();button.click();}});
  document.addEventListener('change',function(e){
   var select=e.target.closest('select.vcs-type-select');if(!select||select.dataset.vcsOwner!==CONFIG.recordId)return;
   var group=select.closest('.js-catalog-filter-item');if(!group)return;
   var value=select.value,boxes=Array.from(group.querySelectorAll('input.js-catalog-filter-opt-chb'));
   boxes.filter(function(box){return box.checked&&(box.dataset.filterValue||box.name)!==value;}).forEach(function(box){box.click();});
   var next=boxes.find(function(box){return (box.dataset.filterValue||box.name)===value;});if(next&&!next.checked)next.click();schedule();
  });
  root.addEventListener('click',function(e){
   var detail=e.target.closest('.vcs-detail');if(detail){e.preventDefault();var card=detail.closest('.t-catalog__card'),original=card.querySelector('.t-catalog__card__textwrapper .js-product-link')||card.querySelector('.js-product-link');if(original)original.click();else location.assign(detail.href);return;}
   var reset=e.target.closest('.vcs-reset');if(reset){var nativeReset=root.querySelector('.js-catalog-filter-reset');if(nativeReset)nativeReset.click();schedule();return;}
   var quote=e.target.closest('.vcs-quote');if(quote)root.dispatchEvent(new CustomEvent('valmo:catalog-quote',{bubbles:true,detail:{title:quote.dataset.vcsProduct,uid:quote.closest('.t-catalog__card').dataset.productUid}}));
   schedule();
  });
  root.addEventListener('change',schedule);window.addEventListener('hashchange',schedule);
  var observer=new MutationObserver(schedule);observer.observe(root,{subtree:true,childList:true});
  root.vcs={refresh:refresh};refresh();return true;
 }
 if(!init()){var waiting=new MutationObserver(function(){if(init())waiting.disconnect();});waiting.observe(document.documentElement,{childList:true,subtree:true});}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
})();

</script>
