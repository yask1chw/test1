.vfc-widget .vfc-toggle { appearance:none; -webkit-appearance:none; display:grid; place-items:center; width:56px; height:56px; flex:none; margin:0; padding:0; border:0; border-radius:50%; background:var(--vfc-red); color:#fff; box-shadow:none; cursor:pointer; pointer-events:auto; touch-action:manipulation; transition:background-color .18s ease; }
.vfc-widget .vfc-toggle:hover { background:var(--vfc-red-hover); }
.vfc-widget .vfc-toggle svg { display:block; width:24px; height:24px; fill:currentColor; }
.vfc-widget .vfc-menu { display:flex; flex-direction:column; align-items:flex-end; gap:12px; width:max-content; max-width:100%; margin:0; padding:0; animation:vfc-show .18s ease both; }
.vfc-widget a.vfc-action { display:flex; align-items:center; gap:12px; width:max-content; max-width:100%; min-height:52px; margin:0; padding:8px 8px 8px 16px; border:0; border-radius:999px; background:var(--vfc-pill); color:#fff !important; font:400 14px/20px "VFCManrope",Arial,sans-serif; letter-spacing:0; text-decoration:none !important; text-transform:none; box-shadow:none; cursor:pointer; pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.vfc-widget a.vfc-action:hover { background:#2f2e2a; color:#fff !important; }
.vfc-widget .vfc-label { display:block; min-width:0; color:inherit; overflow-wrap:anywhere; }
.vfc-widget .vfc-action-icon { display:grid; place-items:center; width:36px; height:36px; flex:none; border-radius:50%; background:rgba(255,255,255,.1); color:#fff; }
.vfc-widget .vfc-action-icon svg { display:block; width:18px; height:18px; fill:currentColor; }
.vfc-widget :is(a,button):focus-visible { outline:3px solid #fff; outline-offset:3px; box-shadow:0 0 0 5px #403e39; }
@keyframes vfc-show { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@media(max-width:639px) { .vfc-widget { right:calc(var(--vfc-mobile-right) + env(safe-area-inset-right,0px)); bottom:calc(var(--vfc-mobile-bottom) + env(safe-area-inset-bottom,0px)); } }
@media(prefers-reduced-motion:reduce) { .vfc-widget .vfc-menu { animation:none; } .vfc-widget .vfc-toggle { transition:none; } }

<script>
(function () {
  'use strict';
  // Replace callbackPopup with the anchor of your native Tilda popup.
  var CONFIG = {
    telegramUrl: 'https://t.me/ValmoRus_Spectehnika',
    callbackPopup: '#popup:valmo-callback',
    right: 20,
    bottom: 20,
    mobileRight: 16,
    mobileBottom: 20
  };
  function init() {
    var roots = Array.from(document.querySelectorAll('[data-valmo-floating]'));
    var existing = roots.find(function (r) { return r.dataset.vfcReady === 'true'; });
    roots.forEach(function (root) {
      if (root.dataset.vfcReady === 'true') return;
      // One floating menu per page, including when HTML blocks are duplicated.
      if (existing) { root.remove(); return; }
      existing = root;
      root.dataset.vfcReady = 'true';
      // A transformed/clipped Zero Block must not become the fixed-position container.
      document.body.appendChild(root);
      root.style.setProperty('--vfc-right', CONFIG.right + 'px');
      root.style.setProperty('--vfc-bottom', CONFIG.bottom + 'px');
      root.style.setProperty('--vfc-mobile-right', CONFIG.mobileRight + 'px');
      root.style.setProperty('--vfc-mobile-bottom', CONFIG.mobileBottom + 'px');
      var toggle = root.querySelector('[data-vfc-toggle]');
      var menu = root.querySelector('[data-vfc-menu]');
      var headset = root.querySelector('[data-vfc-headset]');
      var cross = root.querySelector('[data-vfc-cross]');
      var telegram = root.querySelector('[data-vfc-telegram]');
      var callback = root.querySelector('[data-vfc-callback]');
      var id = 'vfc-menu-' + Math.random().toString(36).slice(2,10);
      menu.id = id;
      toggle.setAttribute('aria-controls', id);
      telegram.setAttribute('href', CONFIG.telegramUrl);
      callback.setAttribute('href', CONFIG.callbackPopup);
      var open = false;
      function setOpen(next, restoreFocus) {
        open = Boolean(next);
        menu.hidden = !open;
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Закрыть меню связи' : 'Связаться с нами');
        headset.hidden = open;
        cross.hidden = !open;
        if (restoreFocus) toggle.focus({ preventScroll:true });
      }
      toggle.addEventListener('click', function () { setOpen(!open, false); });
      toggle.addEventListener('keydown', function (event) {
        if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
        event.preventDefault();
        setOpen(true, false);
        (event.key === 'ArrowUp' ? callback : telegram).focus();
      });
      root.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && open) {
          event.preventDefault();
          event.stopPropagation();
          setOpen(false, true);
        }
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && open) setOpen(false, root.contains(document.activeElement));
      });
      document.addEventListener('click', function (event) {
        if (open && !root.contains(event.target)) setOpen(false, false);
      });
      root.addEventListener('focusout', function (event) {
        if (open && event.relatedTarget && !root.contains(event.relatedTarget)) setOpen(false, false);
      });
      [telegram, callback].forEach(function (link) {
        link.addEventListener('click', function () {
          setOpen(false, true);
          // Native links are preserved: Tilda handles #popup:..., Telegram opens a new tab.
          // No preventDefault, manual popup simulation, or form submission here.
        });
      });
      setOpen(false, false);
      root.vfc = { open:function(){ setOpen(true,false); }, close:function(){ setOpen(false,false); } };
    });
  }
  if (document.body) init();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once:true });
})();

</script>
